# A real pretrained Chronos encoder is downloaded only when training starts.
# Set temporal_backbone: local explicitly for an offline development run.
model:
  temporal_backbone: chronos
  pretrained_model_name: amazon/chronos-t5-tiny
  freeze_pretrained: true
  hidden_dim: 128
  heads: 4
  temporal_layers: 2
  gat_layers: 2
  graph_transformer_layers: 1
  dropout: 0.2
data:
  frequency: 1h
  sequence_length: 24
  forecast_horizon_minutes: 360
  train_fraction: 0.7
  val_fraction: 0.15
graph:
  k_neighbors: 4
  max_distance_km: 5.0
training:
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.01
  patience: 12
  gradient_clip: 1.0
  lead_time_weight: 0.1
  seed: 42
  device: auto
  mixed_precision: true
  min_calibration_samples: 30
  checkpoint_path: backend/ml/checkpoints/multi_hazard.pt
